name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # pnpm version comes from the root package.json "packageManager" field
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Typecheck (tsgo + vue-tsc)
        run: pnpm typecheck

      - name: Unit tests (node:test)
        run: pnpm test

      - name: Verify backend runs as native TypeScript
        run: pnpm --filter @singpulse/backend check

      - name: Build frontend (Vite 8)
        run: pnpm build
